<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференция - TaskFlow Pro</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        accent: '#8B5CF6',
                    }
                }
            }
        }
    </script>

    <!-- WebRTC Engine -->
    <script src="assets/js/webrtc-engine.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f0f0f;
            overflow: hidden;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            gap: 10px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .video-grid.grid-1 { grid-template-columns: 1fr; }
        .video-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .video-grid.grid-3 { grid-template-columns: repeat(2, 1fr); }
        .video-grid.grid-4 { grid-template-columns: repeat(2, 1fr); }
        .video-grid.grid-5,
        .video-grid.grid-6 { grid-template-columns: repeat(3, 1fr); }
        .video-grid.grid-7,
        .video-grid.grid-8,
        .video-grid.grid-9 { grid-template-columns: repeat(3, 1fr); }
        .video-grid.grid-10,
        .video-grid.grid-11,
        .video-grid.grid-12 { grid-template-columns: repeat(4, 1fr); }
        .video-grid.grid-13,
        .video-grid.grid-14,
        .video-grid.grid-15,
        .video-grid.grid-16 { grid-template-columns: repeat(4, 1fr); }

        .video-container {
            position: relative;
            aspect-ratio: 16/9;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .video-container.speaking {
            border-color: #30D158;
            box-shadow: 0 0 20px rgba(48, 209, 88, 0.3);
        }

        .video-container.muted {
            border-color: #FF453A;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .video-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 8px;
        }

        .participant-name {
            color: white;
            font-size: 13px;
            font-weight: 500;
        }

        .video-status {
            display: flex;
            gap: 6px;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .status-icon.muted {
            background: #FF453A;
            color: white;
        }

        .status-icon.video-off {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Avatar placeholder */
        .avatar-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: 600;
        }

        /* Controls Bar */
        .controls-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(16px);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .control-btn.active {
            background: white;
            color: #1a1a1a;
        }

        .control-btn.danger {
            background: #FF453A;
            color: white;
        }

        .control-btn.danger:hover {
            background: #ff564b;
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
        }

        .control-btn .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            margin-bottom: 8px;
        }

        .control-btn:hover .tooltip {
            opacity: 1;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 360px;
            height: 100vh;
            background: rgba(30, 30, 30, 0.98);
            backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-tab {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .sidebar-tab.active {
            color: white;
            border-bottom-color: #3B82F6;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .participant-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .participant-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 13px;
        }

        .participant-info {
            flex: 1;
        }

        .participant-name-sm {
            color: white;
            font-size: 13px;
            font-weight: 500;
        }

        .participant-status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .participant-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .action-btn.mute {
            background: rgba(255, 69, 58, 0.2);
            color: #FF453A;
        }

        .action-btn svg {
            width: 15px;
            height: 15px;
        }

        /* Chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 12px;
        }

        .chat-message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .chat-message-author {
            color: white;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-message-time {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
        }

        .chat-message-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.4;
        }

        .chat-input-container {
            padding: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 6px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 9px 14px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #3B82F6;
        }

        .chat-send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #3B82F6;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .chat-send-btn:hover {
            background: #2563EB;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 16px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 40;
        }

        .conference-title {
            color: white;
            font-size: 15px;
            font-weight: 600;
        }

        .conference-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .recording-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 69, 58, 0.2);
            border-radius: 20px;
            color: #FF453A;
            font-size: 12px;
            font-weight: 500;
        }

        .recording-dot {
            width: 8px;
            height: 8px;
            background: #FF453A;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Waiting Lobby */
        .waiting-lobby {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1A1A2E 0%, #252542 50%, #1A1A2E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .lobby-card {
            background: rgba(20, 20, 25, 0.95);
            backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .lobby-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3B82F6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .lobby-title {
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .lobby-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 22px;
        }

        /* Leave Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-card {
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
        }

        .modal-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 18px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-btn-danger {
            background: #FF453A;
            color: white;
        }

        .modal-btn:hover {
            transform: scale(1.02);
        }

        /* Screen Share */
        .screen-share-notice {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(48, 209, 88, 0.2);
            border: 1px solid rgba(48, 209, 88, 0.3);
            padding: 10px 18px;
            border-radius: 12px;
            color: #30D158;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 60;
        }

        .screen-share-notice svg {
            width: 18px;
            height: 18px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .top-bar {
                padding: 8px 12px;
            }

            .conference-title {
                font-size: 14px;
            }

            .conference-info {
                gap: 6px;
                font-size: 11px;
            }

            .sidebar {
                width: 100%;
                right: -100%;
            }

            .controls-bar {
                padding: 8px 12px;
                flex-wrap: wrap;
            }

            .control-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Waiting Lobby -->
    <div id="waitingLobby" class="waiting-lobby" style="display: none;">
        <div class="lobby-card">
            <div class="lobby-spinner"></div>
            <h1 class="lobby-title">Ожидание конференции</h1>
            <p class="lobby-text">Организатор ещё не начал встречу. Пожалуйста, подождите...</p>
            <button onclick="leaveConference()" class="control-btn danger" style="width: auto; padding: 12px 32px; border-radius: 12px;">
                Покинуть
            </button>
        </div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="conference-title" id="conferenceTitle">Загрузка...</div>
        <div class="conference-info">
            <span id="participantCount">0 участников</span>
            <span id="conferenceDuration">00:00</span>
        </div>
        <button onclick="toggleSidebar()" class="control-btn" style="width: 36px; height: 36px; border-radius: 10px;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="tooltip">Чат</span>
        </button>
    </div>

    <!-- Screen Share Notice -->
    <div id="screenShareNotice" class="screen-share-notice" style="display: none;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        Вы демонстрируете экран
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="video-grid grid-1" style="padding-top: 68px; padding-bottom: 88px;">
        <!-- Videos will be inserted here -->
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">Участники</h2>
            <button onclick="toggleSidebar()" class="action-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        
        <div class="sidebar-tabs">
            <button class="sidebar-tab active" onclick="switchTab('participants')">Участники</button>
            <button class="sidebar-tab" onclick="switchTab('chat')">Чат</button>
        </div>

        <div id="participantsTab" class="sidebar-content">
            <div id="participantsList">
                <!-- Participants will be inserted here -->
            </div>
        </div>

        <div id="chatTab" class="sidebar-content chat-container" style="display: none;">
            <div id="chatMessages" class="chat-messages">
                <!-- Messages will be inserted here -->
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" placeholder="Написать сообщение..." onkeypress="handleChatKeypress(event)">
                <button onclick="sendChatMessage()" class="chat-send-btn">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <button id="audioBtn" onclick="toggleAudio()" class="control-btn active">
            <svg id="audioIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
            </svg>
            <span class="tooltip">Микрофон</span>
        </button>

        <button id="videoBtn" onclick="toggleVideo()" class="control-btn active">
            <svg id="videoIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span class="tooltip">Камера</span>
        </button>

        <button id="screenBtn" onclick="toggleScreenShare()" class="control-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span class="tooltip">Демонстрация</span>
        </button>

        <button onclick="toggleSidebar()" class="control-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="tooltip">Чат</span>
        </button>

        <button onclick="showLeaveModal()" class="control-btn danger">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            <span class="tooltip">Выйти</span>
        </button>
    </div>

    <!-- Leave Modal -->
    <div id="leaveModal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <h3 class="modal-title">Выйти из конференции?</h3>
            <p class="modal-text">Вы не сможете вернуться в эту конференцию после выхода.</p>
            <div class="modal-buttons">
                <button onclick="hideLeaveModal()" class="modal-btn modal-btn-secondary">Отмена</button>
                <button onclick="leaveConference()" class="modal-btn modal-btn-danger">Выйти</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // КОНФИГУРАЦИЯ
        // ============================================
        const STUN_SERVERS = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ]
        };

        // ============================================
        // СОСТОЯНИЕ
        // ============================================
        let conferenceId = null;
        let participantId = null;
        let roomId = null;
        let localStream = null;
        let screenStream = null;
        let audioEnabled = true;
        let videoEnabled = true;
        let isScreenSharing = false;
        let peerConnections = {};
        let chatMessages = [];
        let sidebarOpen = false;
        let currentTab = 'participants';
        let durationInterval = null;
        let pollInterval = null;
        let currentUser = null;
        let webrtcEngine = null; // WebRTC движок

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        async function init() {
            const params = new URLSearchParams(window.location.search);
            roomId = params.get('room');
            participantId = params.get('participant');

            if (!roomId) {
                alert('Не указан идентификатор конференции');
                window.location.href = 'index.html';
                return;
            }

            try {
                // Загружаем информацию о конференции
                await loadConferenceInfo();
                
                // Загружаем текущего пользователя
                await loadCurrentUser();

                // Инициализируем локальный поток
                await initLocalStream();

                // Обновляем сетку видео
                updateVideoGrid();

                // Запускаем опрос сигналов WebRTC
                startSignalPolling();

                // Запускаем таймер длительности
                startDurationTimer();

                // Загружаем участников
                await loadParticipants();

                // Загружаем чат
                await loadChat();

                // Инициализируем WebRTC движок
                webrtcEngine = new WebRTCEngine({
                    conferenceId: conferenceId,
                    participantId: participantId,
                    localStream: localStream,
                    onTrack: handleRemoteTrack,
                    onPeerJoin: handlePeerJoin,
                    onPeerLeave: handlePeerLeave,
                    onError: handleWebRTCError
                });

                // Запускаем опрос сигналов
                webrtcEngine.startSignalPolling();

                // Создаём офер для хоста
                await webrtcEngine.createOfferToHost();
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                alert('Ошибка подключения к конференции: ' + error.message);
            }
        }

        async function loadConferenceInfo() {
            const response = await fetch(`api/conferences/room/${roomId}`);
            const data = await response.json();

            if (!data.success) {
                throw new Error('Конференция не найдена');
            }

            const conference = data.data;
            conferenceId = conference.id;
            document.getElementById('conferenceTitle').textContent = conference.title;

            if (conference.status !== 'active') {
                document.getElementById('waitingLobby').style.display = 'flex';
                throw new Error('Конференция ещё не началась');
            }
        }

        async function loadCurrentUser() {
            try {
                const response = await fetch('api/auth/whoami');
                const data = await response.json();
                if (data.success) {
                    currentUser = data.data;
                }
            } catch (e) {
                console.log('Не удалось загрузить пользователя');
            }
        }

        async function initLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                // Обновляем UI кнопок
                updateAudioButton();
                updateVideoButton();
            } catch (error) {
                console.error('Ошибка получения доступа к медиа:', error);
                alert('Не удалось получить доступ к камере/микрофону');
            }
        }

        // ============================================
        // WEBRTC
        // ============================================
        async function createOfferToHost() {
            // Создаём RTCPeerConnection
            const pc = new RTCPeerConnection(STUN_SERVERS);

            // Добавляем локальный поток
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Обработка удалённых треков
            pc.ontrack = (event) => {
                handleRemoteTrack(event, 'host');
            };

            // Обработка ICE кандидатов
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendIceCandidate(event.candidate, 'host');
                }
            };

            // Создаём офер
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // Отправляем офер через API
            await sendOffer(offer);

            peerConnections['host'] = pc;
        }

        async function handleRemoteTrack(event, peerId) {
            console.log('Получен удалённый трек от:', peerId);
            
            const stream = event.streams[0];
            if (!stream) return;

            // Обновляем сетку видео
            updateVideoGrid();
        }

        async function sendOffer(offer) {
            try {
                const response = await fetch('api/webrtc/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conference_id: conferenceId,
                        from_participant_id: participantId,
                        to_participant_id: 1, // host
                        sdp: JSON.stringify(offer)
                    })
                });

                const data = await response.json();
                console.log('Офер отправлен:', data);
            } catch (error) {
                console.error('Ошибка отправки офера:', error);
            }
        }

        async function sendIceCandidate(candidate, toPeer) {
            try {
                await fetch('api/webrtc/ice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conference_id: conferenceId,
                        from_participant_id: participantId,
                        to_participant_id: toPeer === 'host' ? 1 : null,
                        candidate: JSON.stringify(candidate),
                        sdp_mid: candidate.sdpMid,
                        sdp_mline_index: candidate.sdpMLineIndex
                    })
                });
            } catch (error) {
                console.error('Ошибка отправки ICE кандидата:', error);
            }
        }

        function startSignalPolling() {
            pollInterval = setInterval(async () => {
                await pollForAnswers();
                await pollForIceCandidates();
            }, 1000);
        }

        async function pollForAnswers() {
            try {
                const response = await fetch(`api/webrtc/offers/${conferenceId}?participant_id=${participantId}`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    for (const offer of data.data) {
                        await handleIncomingOffer(offer);
                    }
                }
            } catch (error) {
                console.error('Ошибка опроса ответов:', error);
            }
        }

        async function handleIncomingOffer(offer) {
            const pc = new RTCPeerConnection(STUN_SERVERS);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            pc.ontrack = (event) => {
                handleRemoteTrack(event, offer.from_participant_id);
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendIceCandidate(event.candidate, offer.from_participant_id);
                }
            };

            await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(offer.sdp_offer)));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            // Отправляем ответ
            await fetch(`api/webrtc/offer/${offer.id}/answer`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: JSON.stringify(answer),
                    from_participant_id: participantId
                })
            });

            peerConnections[offer.from_participant_id] = pc;
        }

        async function pollForIceCandidates() {
            try {
                const response = await fetch(`api/webrtc/ice/${conferenceId}?participant_id=${participantId}`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    for (const ice of data.data) {
                        const pc = peerConnections[ice.from_participant_id];
                        if (pc && ice.candidate) {
                            const candidate = new RTCIceCandidate(JSON.parse(ice.candidate));
                            await pc.addIceCandidate(candidate);
                        }
                    }
                }
            } catch (error) {
                console.error('Ошибка опроса ICE:', error);
            }
        }

        // ============================================
        // VIDEO GRID
        // ============================================
        function updateVideoGrid() {
            const grid = document.getElementById('videoGrid');
            // Получаем количество участников из peerConnections webrtcEngine
            const peerCount = webrtcEngine ? webrtcEngine.getPeerConnections().size : 0;
            const participantCount = 1 + peerCount;

            // Обновляем класс сетки
            grid.className = `video-grid grid-${Math.min(participantCount, 16)}`;

            // Очищаем сетку
            grid.innerHTML = '';

            // Добавляем локальное видео
            grid.appendChild(createVideoElement(localStream, 'Вы', true));

            // Добавляем удалённые видео
            if (webrtcEngine) {
                webrtcEngine.getPeerConnections().forEach((pc, peerId) => {
                    const stream = webrtcEngine.getRemoteStream(peerId);
                    grid.appendChild(createVideoElement(stream, `Участник ${peerId}`, false));
                });
            }

            // Обновляем счётчик
            document.getElementById('participantCount').textContent = `${participantCount} участник${participantCount === 1 ? '' : (participantCount < 5 ? 'а' : 'ов')}`;
        }

        function createVideoElement(stream, name, isLocal) {
            const container = document.createElement('div');
            container.className = 'video-container';

            if (stream) {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                if (isLocal) {
                    video.muted = true;
                }
                container.appendChild(video);
            } else {
                const avatar = document.createElement('div');
                avatar.className = 'avatar-placeholder';
                avatar.textContent = name.charAt(0).toUpperCase();
                container.appendChild(avatar);
            }

            const overlay = document.createElement('div');
            overlay.className = 'video-overlay';
            overlay.innerHTML = `
                <span class="participant-name">${name}</span>
                <div class="video-status">
                    <div class="status-icon muted">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                        </svg>
                    </div>
                </div>
            `;

            container.appendChild(overlay);
            return container;
        }

        // ============================================
        // CONTROLS
        // ============================================
        function toggleAudio() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioEnabled = !audioEnabled;
                    audioTrack.enabled = audioEnabled;
                    updateAudioButton();
                }
            }
        }

        function updateAudioButton() {
            const btn = document.getElementById('audioBtn');
            const icon = document.getElementById('audioIcon');
            
            if (audioEnabled) {
                btn.classList.add('active');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>';
            } else {
                btn.classList.remove('active');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>';
            }
        }

        function toggleVideo() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoEnabled = !videoEnabled;
                    videoTrack.enabled = videoEnabled;
                    updateVideoButton();
                }
            }
        }

        function updateVideoButton() {
            const btn = document.getElementById('videoBtn');
            const icon = document.getElementById('videoIcon');
            
            if (videoEnabled) {
                btn.classList.add('active');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>';
            } else {
                btn.classList.remove('active');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
            }
        }

        async function toggleScreenShare() {
            if (!isScreenSharing) {
                if (webrtcEngine) {
                    const success = await webrtcEngine.startScreenShare();
                    if (success) {
                        isScreenSharing = true;
                        document.getElementById('screenBtn').classList.add('active');
                        document.getElementById('screenShareNotice').style.display = 'flex';
                    }
                }
            } else {
                if (webrtcEngine) {
                    await webrtcEngine.stopScreenShare();
                }
                isScreenSharing = false;
                document.getElementById('screenBtn').classList.remove('active');
                document.getElementById('screenShareNotice').style.display = 'none';
            }
        }

        function stopScreenShare() {
            // Эта функция теперь не используется, управление через webrtcEngine
        }

        // ============================================
        // SIDEBAR & CHAT
        // ============================================
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('participantsTab').style.display = tab === 'participants' ? 'block' : 'none';
            document.getElementById('chatTab').style.display = tab === 'chat' ? 'flex' : 'none';
        }

        async function loadParticipants() {
            try {
                const response = await fetch(`api/conferences/${conferenceId}/participants`);
                const data = await response.json();

                if (data.success) {
                    renderParticipants(data.data);
                }
            } catch (error) {
                console.error('Ошибка загрузки участников:', error);
            }
        }

        function renderParticipants(participants) {
            const container = document.getElementById('participantsList');
            container.innerHTML = participants.map(p => `
                <div class="participant-item">
                    <div class="participant-avatar">${(p.full_name || p.guest_name || 'U').charAt(0).toUpperCase()}</div>
                    <div class="participant-info">
                        <div class="participant-name-sm">${p.full_name || p.guest_name || 'Гость'}</div>
                        <div class="participant-status">${p.role}</div>
                    </div>
                    <div class="participant-actions">
                        ${p.role !== 'host' ? `
                        <button class="action-btn mute" title="Заглушить">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                            </svg>
                        </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function loadChat() {
            try {
                const response = await fetch(`api/conferences/${conferenceId}/chat`);
                const data = await response.json();

                if (data.success) {
                    chatMessages = data.data;
                    renderChat();
                }
            } catch (error) {
                console.error('Ошибка загрузки чата:', error);
            }
        }

        function renderChat() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = chatMessages.map(msg => `
                <div class="chat-message">
                    <div class="chat-message-header">
                        <span class="chat-message-author">${msg.sender_name}</span>
                        <span class="chat-message-time">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="chat-message-text">${msg.message}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function handleChatKeypress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;

            try {
                const response = await fetch(`api/conferences/${conferenceId}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        guest_name: currentUser?.full_name || 'Гость'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    input.value = '';
                    await loadChat();
                }
            } catch (error) {
                console.error('Ошибка отправки сообщения:', error);
            }
        }

        // ============================================
        // UTILS
        // ============================================
        function startDurationTimer() {
            const startTime = Date.now();
            durationInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('conferenceDuration').textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        function showLeaveModal() {
            document.getElementById('leaveModal').style.display = 'flex';
        }

        function hideLeaveModal() {
            document.getElementById('leaveModal').style.display = 'none';
        }

        async function leaveConference() {
            // Очищаем интервалы
            if (durationInterval) clearInterval(durationInterval);
            
            // Закрываем WebRTC движок
            if (webrtcEngine) {
                webrtcEngine.close();
                webrtcEngine = null;
            }

            // Останавливаем стримы
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (screenStream) screenStream.getTracks().forEach(track => track.stop());

            // Перенаправляем на страницу конференций
            window.location.href = 'index.html?view=conferences';
        }

        // ============================================
        // ОБРАБОТЧИКИ WEBRTC
        // ============================================
        function handleRemoteTrack(peerId, stream) {
            console.log('Получен удалённый трек от:', peerId);
            // Обновляем сетку видео
            updateVideoGrid();
        }

        function handlePeerJoin(peerId) {
            console.log('Участник присоединился:', peerId);
            loadParticipants(); // Обновляем список участников
        }

        function handlePeerLeave(peerId) {
            console.log('Участник покинул конференцию:', peerId);
            loadParticipants(); // Обновляем список участников
        }

        function handleWebRTCError(message, error) {
            console.error('WebRTC ошибка:', message, error);
            showToastSafe(message, 'error');
        }

        // Запуск при загрузке
        init();
    </script>
</body>
</html>
