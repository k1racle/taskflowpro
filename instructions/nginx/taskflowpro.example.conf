## Example Nginx config for TaskFlow Pro (nginx + php-fpm)
##
## IMPORTANT:
## - Replace server_name and paths.
## - If you use certbot, TLS blocks may be managed automatically.
## - This config assumes TaskFlow Pro is installed in /var/www/taskflowpro
##   and PHP-FPM socket is /run/php/php8.2-fpm.sock.

server {
    listen 80;
    server_name crm.example.ru;

    root /var/www/taskflowpro;
    index index.html index.php;

    # Increase if you upload big files.
    client_max_body_size 64m;

    # Basic hardening.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Service worker must not be cached too aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Static assets: cache.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # App entry points.
    location ~* \.(?:html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Main SPA: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: block installer/debug in production.
    location = /install.php { deny all; return 403; }
    location = /api/debug.php { deny all; return 403; }

    # ================================
    # API ROUTING (replaces api/.htaccess)
    # ================================
    #
    # The PHP router expects: api/index.php?endpoint=<path>
    # So /api/foo/bar becomes endpoint=foo/bar
    #
    location ^~ /api/ {
        # Serve existing files directly (e.g. /api/logs/* should not be public).
        # Block direct access to sensitive dirs.
        location ~* ^/api/(?:logs|backups|audit_exports)/ {
            deny all;
            return 403;
        }

        # Allow direct access to api/index.php if requested.
        if ($uri = /api/index.php) {
            break;
        }

        # Internally rewrite /api/<endpoint> to /api/index.php?endpoint=<endpoint>
        rewrite ^/api/(.*)$ /api/index.php?endpoint=$1 last;
    }

    location ~ ^/api/.*\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # Make PHP aware of HTTPS behind proxy/SSL termination (adjust as needed).
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # Security: don't allow PATH_INFO tricks.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO "";
    }
}
