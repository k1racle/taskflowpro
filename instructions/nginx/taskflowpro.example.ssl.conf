## Example Nginx config for TaskFlow Pro (HTTPS, nginx + php-fpm)
##
## Assumptions:
## - Project root: /var/www/taskflowpro
## - PHP-FPM socket: /run/php/php8.2-fpm.sock
## - TLS certs are already installed (Let's Encrypt or your own)

server {
    listen 80;
    server_name crm.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.example.ru;

    # TLS (example paths)
    ssl_certificate     /etc/letsencrypt/live/crm.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.ru/privkey.pem;

    root /var/www/taskflowpro;
    index index.html index.php;

    # Uploads / attachments
    client_max_body_size 64m;

    # Security headers (baseline; adjust CSP when you know all external deps)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reasonable timeouts (important for long-poll endpoints)
    send_timeout 30s;

    # Service worker must not be cached too aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Static assets: cache.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # App entry points.
    location ~* \.(?:html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Security: block installer/debug in production.
    location = /install.php { deny all; return 403; }
    location = /api/debug.php { deny all; return 403; }

    # Main SPA: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ================================
    # API ROUTING (replaces api/.htaccess)
    # ================================
    location ^~ /api/ {
        location ~* ^/api/(?:logs|backups|audit_exports)/ {
            deny all;
            return 403;
        }

        rewrite ^/api/(.*)$ /api/index.php?endpoint=$1 last;
    }

    location ~ ^/api/.*\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # Long-poll endpoints may run up to ~25s; give headroom.
        fastcgi_read_timeout 60s;

        # Pass proto/forwarded headers
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO "";
    }
}

