<!-- ============================================
     OBJECT MODAL WITH TABS - Premium Version
     Вкладки: Основное | Фото | Удобства | Услуги
     ============================================ -->

<div x-show="showObjectModal"
     x-cloak
     x-transition.opacity
     class="fixed inset-0 z-[150] flex items-center justify-center p-4 backdrop-blur-sm bg-black/50"
     @click.self="showObjectModal = false">
    <div class="liquid-glass-pro rounded-sm shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="p-6 crm-border-bottom">
            <div class="flex items-center justify-between mb-4">
                <h2 class="crm-screen-title crm-text-accent" x-text="editingObjectId ? 'Редактировать объект' : 'Добавить объект'"></h2>
                <button @click="showObjectModal = false" class="crm-btn-ghost crm-icon-button" aria-label="Закрыть">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Вкладки -->
            <div class="flex gap-2">
                <button @click="objectModalTab = 'main'"
                        :class="objectModalTab === 'main' ? 'liquid-glass-pro shadow-md' : ''"
                        class="px-4 py-2 rounded-sm transition-all flex items-center gap-2 font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Основное
                </button>
                <button @click="objectModalTab = 'photos'; loadObjectPhotos(editingObjectId)"
                        :class="objectModalTab === 'photos' ? 'liquid-glass-pro shadow-md' : ''"
                        class="px-4 py-2 rounded-sm transition-all flex items-center gap-2 font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    Фото
                </button>
                <button @click="objectModalTab = 'amenities'"
                        :class="objectModalTab === 'amenities' ? 'liquid-glass-pro shadow-md' : ''"
                        class="px-4 py-2 rounded-sm transition-all flex items-center gap-2 font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                    </svg>
                    Удобства
                </button>
                <button @click="objectModalTab = 'services'"
                        :class="objectModalTab === 'services' ? 'liquid-glass-pro shadow-md' : ''"
                        class="px-4 py-2 rounded-sm transition-all flex items-center gap-2 font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                    Услуги
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-6">
            
            <!-- Вкладка: Основное -->
            <div x-show="objectModalTab === 'main'" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Название *</label>
                        <input type="text" x-model="objectForm.title" required class="w-full px-4 py-3 crm-control-input">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Описание</label>
                        <textarea x-model="objectForm.description" rows="3" class="w-full px-4 py-3 crm-control-textarea"></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Тип *</label>
                        <select x-model="objectForm.type" required class="w-full px-4 py-3 crm-control-select">
                            <option value="house">Дом</option>
                            <option value="apartment">Квартира</option>
                            <option value="hotel">Гостиница</option>
                            <option value="resort">Курорт</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Город</label>
                        <input type="text" x-model="objectForm.city" class="w-full px-4 py-3 crm-control-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Статус</label>
                        <select x-model="objectForm.status" class="w-full px-4 py-3 crm-control-select">
                            <option value="active">Активен</option>
                            <option value="draft">Черновик</option>
                        </select>
                    </div>
                    <div class="col-span-3">
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Адрес</label>
                        <input type="text" x-model="objectForm.address" class="w-full px-4 py-3 crm-control-input">
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Гостей</label>
                        <input type="number" x-model="objectForm.maxGuests" class="w-full px-4 py-3 crm-control-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Спален</label>
                        <input type="number" x-model="objectForm.bedrooms" class="w-full px-4 py-3 crm-control-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Ванных</label>
                        <input type="number" x-model="objectForm.bathrooms" class="w-full px-4 py-3 crm-control-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Площадь (м²)</label>
                        <input type="number" x-model="objectForm.area" class="w-full px-4 py-3 crm-control-input">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Цена за ночь (₽) *</label>
                        <input type="number" x-model="objectForm.basePrice" required class="w-full px-4 py-3 crm-control-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 crm-text-secondary">Залог (₽)</label>
                        <input type="number" x-model="objectForm.securityDeposit" class="w-full px-4 py-3 crm-control-input">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="flex items-center gap-3 p-4 rounded-sm crm-tone-accent">
                        <input type="checkbox" x-model="objectForm.canHavePets" id="canHavePets" class="rounded">
                        <label for="canHavePets" class="font-semibold crm-text-accent">Можно с животными</label>
                    </div>
                    <div class="flex items-center gap-3 p-4 rounded-sm crm-tone-accent">
                        <input type="checkbox" x-model="objectForm.canHaveChildren" id="canHaveChildren" class="rounded">
                        <label for="canHaveChildren" class="font-semibold crm-text-accent">Можно с детьми</label>
                    </div>
                </div>
            </div>

            <!-- Вкладка: Фото -->
            <div x-show="objectModalTab === 'photos'" class="space-y-4">
                <div class="p-6 border-2 border-dashed rounded-sm text-center"
                     :class="dragOver ? 'crm-option-active' : 'crm-option-inactive'"
                     @dragover.prevent="dragOver = true"
                     @dragleave.prevent="dragOver = false"
                     @drop.prevent="handlePhotoDrop">
                    <svg class="w-16 h-16 mx-auto mb-4 crm-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <p class="text-sm crm-text-secondary mb-4">Перетащите фото сюда или нажмите для выбора</p>
                    <input type="file" id="photoUpload" accept="image/*" multiple @change="handlePhotoUpload" class="hidden">
                    <button @click="$refs.photoUpload.click()" class="px-6 py-3 rounded-sm crm-gradient-primary font-semibold crm-hover-shadow-lg transition-shadow">
                        Выбрать фото
                    </button>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <template x-for="(photo, index) in objectPhotos" :key="photo.id || index">
                        <div class="relative group">
                            <img :src="photo.file_path" :alt="'Фото ' + (index + 1)" class="w-full h-32 object-cover rounded-sm">
                            <div class="absolute inset-0 crm-overlay-dark opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 rounded-sm">
                                <button @click="setPrimaryPhoto(photo.id)" class="p-2 rounded-full crm-photo-primary-btn transition-colors" title="Сделать главным">
                                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                    </svg>
                                </button>
                                <button @click="deletePhoto(photo.id)" class="p-2 rounded-full crm-photo-delete-btn transition-colors" title="Удалить">
                                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </button>
                            </div>
                            <span x-show="photo.is_primary" class="absolute top-2 right-2 px-2 py-1 rounded-lg crm-badge-accent-solid text-xs font-semibold">
                                Главное
                            </span>
                        </div>
                    </template>
                    <!-- Показываем сообщение, если фото нет -->
                    <div x-show="objectPhotos.length === 0" class="col-span-full text-center py-8 crm-text-secondary">
                        Нет фотографий. Загрузите первое фото.
                    </div>
                </div>
            </div>

            <!-- Вкладка: Удобства -->
            <div x-show="objectModalTab === 'amenities'" class="space-y-4">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('wifi') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="wifi" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">📶</span>
                        <span class="font-semibold">WiFi</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('parking') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="parking" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🅿️</span>
                        <span class="font-semibold">Парковка</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('pool') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="pool" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🏊</span>
                        <span class="font-semibold">Бассейн</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('ac') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="ac" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">❄️</span>
                        <span class="font-semibold">Кондиционер</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('tv') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="tv" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">📺</span>
                        <span class="font-semibold">TV</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('kitchen') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="kitchen" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🍳</span>
                        <span class="font-semibold">Кухня</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('washing_machine') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="washing_machine" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🧺</span>
                        <span class="font-semibold">Стиральная машина</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('balcony') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="balcony" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🌅</span>
                        <span class="font-semibold">Балкон</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('gym') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="gym" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">💪</span>
                        <span class="font-semibold">Спортзал</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('sauna') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="sauna" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🧖</span>
                        <span class="font-semibold">Сауна</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('jacuzzi') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="jacuzzi" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🛁</span>
                        <span class="font-semibold">Джакузи</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('fireplace') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="fireplace" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🔥</span>
                        <span class="font-semibold">Камин</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('bbq') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="bbq" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🍖</span>
                        <span class="font-semibold">Мангал</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('workspace') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="workspace" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">💻</span>
                        <span class="font-semibold">Рабочее место</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('elevator') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="elevator" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🛗</span>
                        <span class="font-semibold">Лифт</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                           :class="objectForm.amenities?.includes('sea_view') ? 'crm-option-active' : 'crm-option-inactive'">
                        <input type="checkbox" value="sea_view" x-model="objectForm.amenities" class="hidden">
                        <span class="text-2xl">🌊</span>
                        <span class="font-semibold">Вид на море</span>
                    </label>
                </div>
            </div>

            <!-- Вкладка: Услуги -->
            <div x-show="objectModalTab === 'services'" class="space-y-4">
                <div class="text-sm crm-text-tertiary">
                    Выберите услуги которые доступны для этого объекта:
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <template x-for="service in availableServices" :key="service.id">
                        <label class="flex items-center justify-between p-4 rounded-sm border cursor-pointer crm-hover-accent-border transition-colors"
                               :class="objectForm.services?.includes(service.id) ? 'crm-option-active' : 'crm-option-inactive'">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" :value="service.id" x-model="objectForm.services" class="hidden">
                                <div class="w-10 h-10 rounded-sm bg-gradient-to-br from-blue-500/10 to-purple-600/10 flex items-center justify-center">
                                    <span class="text-xl"></span>
                                </div>
                                <div>
                                    <div class="font-semibold crm-text-accent" x-text="service.service_name"></div>
                                    <div class="text-xs crm-text-tertiary" x-text="formatCurrency(service.base_price) + ' ₽'"></div>
                                </div>
                            </div>
                            <svg class="w-5 h-5" :class="objectForm.services?.includes(service.id) ? 'crm-text-info' : 'crm-text-tertiary'" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                            </svg>
                        </label>
                    </template>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="p-6 crm-border-t flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button type="button" @click="deleteObject()" x-show="editingObjectId"
                        class="px-6 py-4 rounded-sm crm-btn-danger">
                    Удалить
                </button>
            </div>
            <button type="button" @click="saveObjectWithTabs()" :disabled="objectLoading"
                    class="px-8 py-4 rounded-sm bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold text-lg shadow-lg hover:shadow-xl transition-all disabled:opacity-50">
                <span x-show="!objectLoading">Сохранить</span>
                <span x-show="objectLoading">Сохранение...</span>
            </button>
        </div>
    </div>
</div>
