<div class="space-y-4" @dragover.prevent>
  <div class="liquid-glass-pro rounded-sm crm-screen-section p-5">
    <div class="crm-toolbar crm-toolbar--dense">
      <div class="crm-toolbar-main">
        <div class="crm-toolbar-summary">
          <div class="crm-summary-tile">
            <div class="crm-summary-label">Этапы</div>
            <div class="crm-summary-value" x-text="crmStages.length"></div>
          </div>
          <div class="crm-summary-tile">
            <div class="crm-summary-label">Сделки</div>
            <div class="crm-summary-value" x-text="(crmDeals || []).length"></div>
          </div>
          <div class="crm-summary-tile">
            <div class="crm-summary-label">Сумма</div>
            <div class="crm-summary-value" x-text="crmFormatMoney((crmDeals || []).reduce((sum, deal) =&gt; sum + Number(deal.amount || 0), 0))"></div>
          </div>
        </div>
      </div>
      <div class="crm-toolbar-actions">
        <!-- Список воронок с кнопкой удаления -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" class="crm-btn-secondary text-sm flex items-center gap-2 crm-toolbar-select">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
            <span x-text="(crmPipelines || []).find(p =&gt; p.id === crmActivePipelineId)?.name || 'Воронки'"></span>
          </button>
          <div x-show="open" @click.away="open = false" x-cloak
               class="absolute right-0 mt-2 w-56 crm-popover-menu rounded-sm shadow-2xl z-[99999] overflow-hidden">
            <div class="p-2 space-y-1">
              <template x-for="p in (crmPipelines || [])" :key="p.id">
                <div class="flex items-center justify-between gap-2">
                  <button @click="crmActivePipelineId = p.id; crmLoadFunnels(); open = false"
                          class="flex-1 text-left px-3 py-2 rounded-sm crm-menu-item text-sm"
                          :class="crmActivePipelineId === p.id ? 'crm-filter-pill-active' : ''"
                          x-text="p.name">
                  </button>
                  <button @click="crmDeletePipeline(p.id); open = false"
                          class="rounded-sm crm-icon-button crm-btn-danger"
                          title="Удалить воронку">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                  </button>
                </div>
              </template>
              <div class="h-px my-1 crm-ui-subcard"></div>
              <button @click="crmOpenPipelineModal(); open = false"
                      class="w-full text-left px-3 py-2 rounded-sm crm-menu-item text-sm">
                + Новая воронка
              </button>
            </div>
          </div>
        </div>
        <button @click="crmOpenDealModal()" class="crm-btn-primary text-sm flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Сделка
        </button>
      </div>
    </div>

    <div class="mt-4 crm-filterbar">
      <div class="crm-filter-field">
        <div class="crm-filter-label">Поиск</div>
        <div class="mt-2 flex items-center gap-3">
        <svg class="w-5 h-5 crm-ui-filter-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 110-15 7.5 7.5 0 010 15z"/>
        </svg>
          <label for="crm-funnels-search" class="sr-only">Поиск сделок в воронке</label>
          <input id="crm-funnels-search" name="crm_funnels_search" x-model.debounce.300ms="crmDealsQuery" @input="crmLoadFunnels()" placeholder="Поиск сделок" class="crm-control-input crm-input-no-suggest" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>
      </div>
      <div class="crm-filter-field">
        <div class="crm-filter-label">Клиент</div>
        <div class="mt-2 flex items-center gap-3">
        <svg class="w-5 h-5 crm-ui-filter-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10M7 12h10M7 17h10"/>
        </svg>
          <label for="crm-funnels-client-filter" class="sr-only">Фильтр воронки по клиенту</label>
          <input id="crm-funnels-client-filter" name="crm_funnels_client_filter" x-model.debounce.300ms="crmFunnelsClientFilter" @input="crmLoadFunnels()" placeholder="Клиент ID" class="crm-control-input crm-input-no-suggest" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>
      </div>
      <div class="crm-filter-field">
        <div class="crm-filter-label">Показатели колонки</div>
        <div class="mt-2 flex items-center gap-3">
        <svg class="w-5 h-5 crm-ui-filter-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
          <button @click="crmToggleColumnDisplayMode()" 
                class="text-sm flex-1 text-left crm-menu-item crm-ui-muted">
            <span x-text="crmGetColumnDisplayModeLabel()"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="overflow-x-auto">
    <div class="min-w-[980px] grid" :style="'grid-template-columns: repeat(' + (crmStages.length || 1) + ', minmax(250px, 1fr)); gap: 12px;'">
      <template x-for="stage in crmStages" :key="stage.id">
        <div class="liquid-glass-pro rounded-sm p-5 crm-kanban-column"
             @drop.prevent="crmOnDealDrop(stage.id)"
             @dragenter.prevent
             @dragover.prevent>
          <div class="flex items-start justify-between gap-3 crm-kanban-column-head">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full" :style="'background:' + (stage.color || 'var(--crm-accent)')"></div>
                <div class="font-semibold truncate crm-ui-title" x-text="crmGetStageDisplayName(stage)"></div>
              </div>
              <div class="mt-3 flex flex-wrap gap-2">
                <div class="crm-stage-chip" x-show="(crmColumnDisplayMode || 'both') === 'both' || (crmColumnDisplayMode || 'both') === 'count'">
                  <span class="crm-stage-chip-label">Сделок</span>
                  <span class="crm-stage-chip-value" x-text="crmDealsByStage(stage.id).length"></span>
                </div>
                <div class="crm-stage-chip" x-show="(crmColumnDisplayMode || 'both') === 'both' || (crmColumnDisplayMode || 'both') === 'sum'">
                  <span class="crm-stage-chip-label">Сумма</span>
                  <span class="crm-stage-chip-value" x-text="crmFormatMoney(crmStageSum(stage.id))"></span>
                </div>
              </div>
            </div>
              <!-- edit stage removed from column header (use context menus / stage modal flows elsewhere) -->
          </div>

          <div class="mt-3 space-y-2 max-h-[68vh] overflow-y-auto pr-1">
            <template x-for="d in crmDealsByStage(stage.id)" :key="d.id">
              <div class="rounded-sm p-4 crm-kanban-card" draggable="true"
                   @dragstart="crmOnDealDragStart(d)"
                   @contextmenu.prevent.stop="openCrmContextMenu($event, d, stage)">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                      <div class="font-semibold text-sm leading-[1.35] truncate crm-ui-title" x-text="d.title"></div>
                      <div class="mt-1 flex items-center gap-2 min-w-0">
                        <div class="text-xs truncate crm-ui-muted" x-text="d.client_name"></div>
                        <button type="button"
                                x-show="d.client_phone"
                                @click.stop="prostieZvonkiMakeCall(d.client_phone, { crm_deal_id: d.id, crm_client_id: d.client_id })"
                                class="crm-btn-ghost crm-icon-button"
                                aria-label="Позвонить клиенту">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.128a11.042 11.042 0 005.516 5.516l1.128-2.257a1 1 0 011.21-.502l4.493 1.498A1 1 0 0121 16.72V20a2 2 0 01-2 2h-1C9.716 22 2 14.284 2 5V4a1 1 0 011-1z" />
                          </svg>
                        </button>
                      </div>
                    </div>
                  <button @click="crmOpenDealModal(d)" class="text-xs crm-soft-action">Открыть</button>
                </div>
                <div class="mt-3 crm-kanban-meta">
                  <div>
                    <div class="text-xs font-medium crm-ui-faint">Сумма</div>
                    <div class="text-sm font-bold crm-ui-title" x-text="crmFormatMoney(d.amount, d.currency)"></div>
                  </div>
                  <div class="crm-kanban-badge" x-text="(d.probability || 0) + '%'"></div>
                </div>
                <div class="mt-3 flex items-center justify-between gap-2">
                  <button @click="crmCreateLinkedTask({ deal_id: d.id, client_id: d.client_id })" class="text-xs crm-soft-action">+ задача</button>
                  <div class="text-[11px] crm-kanban-date" x-text="d.expected_close_date ? formatDate(d.expected_close_date) : ''"></div>
                </div>
              </div>
            </template>
            <!-- empty state removed by request: empty column is self-explanatory -->
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- CRM Deal context menu (ПКМ) -->
<div x-show="crmContextMenuOpen" x-cloak class="fixed inset-0 z-[200]" @click="closeCrmContextMenu()">
  <div class="fixed crm-popover-menu rounded-sm overflow-hidden shadow-2xl z-[201]"
       :style="`left: ${Math.min(crmContextMenuX, window.innerWidth - 240)}px; top: ${Math.min(crmContextMenuY, window.innerHeight - 200)}px; min-width: 220px; border:1px solid var(--lg-border);`"
       @click.stop @contextmenu.prevent>
    <div class="p-2">
      <button class="w-full text-left px-3 py-2 rounded-sm crm-menu-item"
              @click="crmOpenDealModal(crmContextMenuDeal); closeCrmContextMenu()">
        <div class="text-sm font-semibold crm-ui-title">Открыть</div>
        <div class="text-xs crm-ui-faint">Редактировать сделку</div>
      </button>

      <button class="w-full text-left px-3 py-2 rounded-sm crm-menu-item"
              @click="crmCreateLinkedTask({ deal_id: crmContextMenuDeal?.id, client_id: crmContextMenuDeal?.client_id }); closeCrmContextMenu()">
        <div class="text-sm font-semibold crm-ui-title">+ Задача</div>
        <div class="text-xs crm-ui-faint">Создать задачу по сделке</div>
      </button>

      <div class="my-2"><div class="crm-divider opacity-70"></div></div>

      <button class="w-full text-left px-3 py-2 rounded-sm crm-menu-item crm-tone-danger"
              @click="crmDeleteDeal(crmContextMenuDeal?.id)">
        <div class="text-sm font-semibold">Убрать в архив</div>
        <div class="text-xs" style="color: currentColor">Без удаления информации</div>
      </button>
    </div>
  </div>
</div>
