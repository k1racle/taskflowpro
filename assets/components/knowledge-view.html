<!-- ============================================
     KNOWLEDGE VIEW - PRO 2027
     ============================================ -->

<div x-data="{ knowledgeSearch: '', knowledgeType: 'all', knowledgePreviewId: null }" class="space-y-4">
    <div class="liquid-glass-pro rounded-3xl p-6 crm-screen-section">
        <div class="crm-toolbar crm-toolbar--dense">
            <div class="crm-toolbar-main">
                <div class="crm-toolbar-summary">
                    <div class="crm-summary-tile">
                        <div class="crm-summary-label">Материалы</div>
                        <div class="crm-summary-value" x-text="knowledgeArticles.length"></div>
                    </div>
                    <div class="crm-summary-tile">
                        <div class="crm-summary-label">Статьи</div>
                        <div class="crm-summary-value" x-text="window.TaskFlowKnowledge.countKnowledgeArticles($data, 'article')"></div>
                    </div>
                    <div class="crm-summary-tile">
                        <div class="crm-summary-label">FAQ</div>
                        <div class="crm-summary-value" x-text="window.TaskFlowKnowledge.countKnowledgeArticles($data, 'faq')"></div>
                    </div>
                    <div class="crm-summary-tile">
                        <div class="crm-summary-label">Медиа</div>
                        <div class="crm-summary-value" x-text="window.TaskFlowKnowledge.countKnowledgeArticles($data, 'video') + window.TaskFlowKnowledge.countKnowledgeArticles($data, 'slides')"></div>
                    </div>
                </div>
            </div>
            <div class="crm-toolbar-actions">
                <button @click="openKnowledgeModal()"
                        class="crm-btn-primary text-sm font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Добавить материал
                </button>
            </div>
        </div>

        <div class="mt-5 crm-filterbar crm-filterbar-wide">
            <div class="crm-filter-field crm-filter-field-search">
                <div class="crm-filter-label">Поиск</div>
                <div class="mt-2 flex items-center gap-3">
                    <svg class="w-4 h-4" style="color: var(--lg-text-tertiary)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
                    </svg>
                    <label for="knowledge-search" class="sr-only">Поиск по базе знаний</label>
                    <input id="knowledge-search" name="knowledge_search" type="text" x-model="knowledgeSearch" placeholder="Название, содержание, вопрос" class="crm-control-input text-sm crm-input-no-suggest" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                </div>
            </div>
            <div class="crm-filter-field">
                <div class="crm-filter-label">Тип</div>
                <div class="mt-2">
                    <label for="knowledge-type" class="sr-only">Тип материала базы знаний</label>
                    <select id="knowledge-type" name="knowledge_type" x-model="knowledgeType" class="crm-control-select text-sm">
                        <option value="all">Все материалы</option>
                        <option value="article">Статьи</option>
                        <option value="faq">FAQ</option>
                        <option value="video">Видео</option>
                        <option value="slides">Презентации</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,420px),minmax(0,1fr)] gap-4 items-start">
        <div class="liquid-glass-pro rounded-3xl overflow-hidden crm-table-shell crm-master-panel">
            <div class="crm-table-toolbar crm-toolbar crm-toolbar--dense">
                <div class="crm-section-head__content">
                    <div class="crm-section-head__title">Каталог материалов</div>
                    <div class="crm-section-head__text">Список статей, FAQ и медиа с быстрым предпросмотром справа.</div>
                </div>
                <div class="flex items-center gap-2 flex-wrap crm-section-head__meta">
                    <span class="crm-inline-badge">В выборке: <span class="ml-1" x-text="window.TaskFlowKnowledge.countKnowledgeArticles($data, knowledgeType, knowledgeSearch)"></span></span>
                </div>
            </div>

            <div class="p-3 space-y-2 max-h-[72vh] overflow-y-auto">
                <template x-for="article in window.TaskFlowKnowledge.filterKnowledgeArticles($data, knowledgeSearch, knowledgeType)" :key="article.id">
                    <div class="crm-knowledge-row" :class="knowledgePreviewId === article.id ? 'crm-knowledge-row-active' : ''">
                        <div class="crm-knowledge-row-shell">
                            <button type="button"
                                    @click="knowledgePreviewId = article.id"
                                    class="crm-knowledge-row-main">
                                <div class="crm-knowledge-icon">
                                    <template x-if="article.type === 'video'"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></template>
                                    <template x-if="article.type === 'slides'"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg></template>
                                    <template x-if="article.type === 'faq'"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.96 9.96 0 01-4.243-.947L4 20l1.06-3.747A8.968 8.968 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></template>
                                    <template x-if="!article.type || article.type === 'article'"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></template>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h3 class="text-sm font-semibold truncate" style="color: var(--lg-text-primary)" x-text="window.TaskFlowKnowledge.getKnowledgeArticleTitle($data, article)"></h3>
                                        <span class="crm-inline-badge" x-text="window.TaskFlowKnowledge.getKnowledgeTypeLabel($data, article)"></span>
                                    </div>
                                    <p class="crm-knowledge-row-preview text-sm" style="color: var(--lg-text-secondary)" x-text="window.TaskFlowKnowledge.getKnowledgeArticlePreview($data, article)"></p>
                                </div>
                            </button>
                            <button type="button"
                                    @click.stop="openKnowledgeModal(article)"
                                    class="crm-soft-action crm-knowledge-row-action text-xs flex-shrink-0">
                                Открыть
                            </button>
                        </div>
                    </div>
                </template>

                <div x-show="window.TaskFlowKnowledge.countKnowledgeArticles($data, knowledgeType, knowledgeSearch) === 0"
                     class="crm-empty-state text-center p-10">
                    <svg class="w-16 h-16 mx-auto mb-4 opacity-30" style="color: var(--lg-text-primary)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <div class="crm-empty-state-title">Ничего не найдено</div>
                    <div class="crm-empty-state-text">Измените фильтры или добавьте новый материал в базу знаний.</div>
                </div>
            </div>
        </div>

        <div class="liquid-glass-pro rounded-3xl p-6 crm-detail-panel min-h-[420px] crm-knowledge-reader" x-effect="knowledgePreviewId = window.TaskFlowKnowledge.ensureKnowledgePreviewId($data, knowledgePreviewId)">

            <template x-if="window.TaskFlowKnowledge.getKnowledgeSelectedArticle($data, knowledgePreviewId)">
                <div class="crm-panel-stack crm-panel-stack--compact" x-data="{ selectedArticle: window.TaskFlowKnowledge.getKnowledgeSelectedArticle($data, knowledgePreviewId) }" x-effect="selectedArticle = window.TaskFlowKnowledge.getKnowledgeSelectedArticle($data, knowledgePreviewId)">
                    <div class="crm-section-head">
                        <div class="crm-section-head__content min-w-0 flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="crm-inline-badge" x-text="window.TaskFlowKnowledge.getKnowledgeTypeLabel($data, selectedArticle)"></span>
                            </div>
                            <h2 class="crm-section-head__title mt-3" x-text="window.TaskFlowKnowledge.getKnowledgeArticleTitle($data, selectedArticle)"></h2>
                        </div>
                        <div class="crm-section-head__meta crm-record-card-action">
                            <button @click="openKnowledgeModal(selectedArticle)" class="text-sm font-medium flex items-center gap-2" style="color: var(--lg-text-primary)">
                                <svg class="w-4 h-4" style="color: var(--lg-text-tertiary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="crm-panel-muted rounded-3xl p-5 crm-card-compact">
                        <div class="crm-summary-label">Содержимое</div>
                        <div class="mt-3 text-sm whitespace-pre-line crm-knowledge-body" style="color: var(--lg-text-primary)" x-text="window.TaskFlowKnowledge.getKnowledgeArticleBody($data, selectedArticle)"></div>
                    </div>
                </div>
            </template>

            <div x-show="knowledgeArticles.length === 0" class="crm-empty-state h-full flex flex-col items-center justify-center text-center">
                <svg class="w-16 h-16 opacity-30 mb-4" style="color: var(--lg-text-primary)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                <div class="crm-empty-state-title">База знаний пока пуста</div>
                <div class="crm-empty-state-text">Добавьте первый материал, чтобы начать работу с базой знаний.</div>
            </div>
        </div>
    </div>
</div>
