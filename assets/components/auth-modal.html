<!-- ============================================
     AUTH MODAL - Компонент авторизации
     ============================================ -->

<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
    <div class="glass-card rounded-3xl shadow-2xl p-8 w-full max-w-md">
        <!-- Логотип -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl shadow-lg mb-4 bg-white/10">
                <img src="app.png" alt="TaskFlow" class="w-14 h-14 object-cover">
            </div>
            <h1 class="text-3xl font-bold text-gray-800 dark:text-white" x-text="settings.company_name || 'TaskFlow Pro'"></h1>
            <p class="text-gray-500 dark:text-gray-400 mt-2">Вход в систему</p>
        </div>

        <!-- Форма входа -->
        <form @submit.prevent="login" class="space-y-5">
            <div x-show="loginError" class="p-4 rounded-xl bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800" x-text="loginError"></div>

            <div>
                <label for="auth-login" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    Логин
                </label>
                <input id="auth-login" name="login" type="text" x-model="loginForm.login" required
                       class="w-full px-4 py-3 rounded-xl crm-control-input"
                       placeholder="admin">
            </div>

            <div>
                <label for="auth-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    Пароль
                </label>
                <input id="auth-password" name="password" type="password" x-model="loginForm.password" required
                       class="w-full px-4 py-3 rounded-xl crm-control-input"
                       placeholder="••••••••">
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full crm-btn-primary transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <span x-show="!loading">Войти</span>
                <span x-show="loading">
                    <svg class="animate-spin inline w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Вход...
                </span>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="install.php" class="text-sm text-gray-500 dark:text-gray-400 hover:text-primary transition-colors">
                Переустановить базу данных →
            </a>
        </div>
    </div>
</div>
