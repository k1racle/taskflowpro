<!-- ============================================
     ПОЧТА - МОДАЛЬНЫЕ ОКНА (Modern Yandex/Gmail Style)
     ============================================ -->

<!-- Модальное окно написания письма -->
<div x-show="mailComposeModalOpen"
     x-transition.opacity
     class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-md"
     @click.self="mailComposeModalOpen = false"
     x-cloak>

    <div class="liquid-glass-pro rounded-sm shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
        <!-- Хэдер -->
        <div class="px-6 py-4 border-b border-gray-200/50 dark:border-gray-700/50 flex items-center justify-between bg-gradient-to-r from-primary/10 to-accent/10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-sm flex items-center justify-center" style="background: linear-gradient(135deg, var(--lg-primary) 0%, var(--lg-accent) 100%)">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold crm-text-primary">Новое письмо</h3>
                    <p class="text-xs crm-text-tertiary">Заполните поля и отправьте</p>
                </div>
            </div>
            <button @click="mailComposeModalOpen = false" class="crm-btn-ghost crm-icon-button hover:bg-gray-200/50 dark:hover:bg-gray-700/50 transition-colors">
                <svg class="w-5 h-5 crm-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Форма -->
        <div class="p-6 space-y-4 overflow-y-auto flex-1">
            <!-- Получатель -->
            <div>
                <label for="compose-mail-to" class="block text-sm font-semibold mb-2 crm-text-secondary">Получатель</label>
                <div class="flex items-center gap-2 px-4 py-3 crm-control-input focus-within:ring-2 focus-within:ring-primary/30 transition-all">
                    <svg class="w-5 h-5 flex-shrink-0 crm-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <input id="compose-mail-to" name="compose_to" type="email" x-model="composeMailForm.to" placeholder="email@example.com" class="flex-1 bg-transparent border-none outline-none text-sm crm-text-primary">
                </div>
            </div>

            <!-- Тема -->
            <div>
                <label for="compose-mail-subject" class="block text-sm font-semibold mb-2 crm-text-secondary">Тема</label>
                <div class="flex items-center gap-2 px-4 py-3 crm-control-input focus-within:ring-2 focus-within:ring-primary/30 transition-all">
                    <svg class="w-5 h-5 flex-shrink-0 crm-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                    </svg>
                    <input id="compose-mail-subject" name="compose_subject" type="text" x-model="composeMailForm.subject" placeholder="Тема письма" class="flex-1 bg-transparent border-none outline-none text-sm crm-text-primary">
                </div>
            </div>

            <!-- Панель форматирования -->
            <div x-show="composeMailForm.is_html" class="flex items-center gap-1 p-2 rounded-sm bg-gray-100/50 dark:bg-gray-800/50 flex-wrap">
                <button type="button" @click="applyMailFormat('bold')" class="p-2 rounded-lg hover:bg-white/50 dark:hover:bg-gray-700/50 transition-colors" title="Жирный">
                    <span class="font-bold text-sm crm-text-primary">B</span>
                </button>
                <button type="button" @click="applyMailFormat('italic')" class="p-2 rounded-lg hover:bg-white/50 dark:hover:bg-gray-700/50 transition-colors" title="Курсив">
                    <span class="italic text-sm crm-text-primary">I</span>
                </button>
                <button type="button" @click="applyMailFormat('underline')" class="p-2 rounded-lg hover:bg-white/50 dark:hover:bg-gray-700/50 transition-colors" title="Подчёркнутый">
                    <span class="underline text-sm crm-text-primary">U</span>
                </button>
                <div class="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                <button type="button" @click="applyMailFormat('insertUnorderedList')" class="p-2 rounded-lg hover:bg-white/50 dark:hover:bg-gray-700/50 transition-colors" title="Список">
                    <svg class="w-4 h-4 crm-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <button type="button" @click="insertMailLink()" class="px-3 py-1 rounded-lg hover:bg-white/50 dark:hover:bg-gray-700/50 transition-colors text-sm" title="Ссылка">
                    <svg class="w-4 h-4 inline crm-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                    </svg>
                    Ссылка
                </button>
            </div>

            <!-- Текстовый редактор -->
            <div>
                <label class="block text-sm font-semibold mb-2 crm-text-secondary">
                    Сообщение
                    <button type="button" @click="composeMailForm.is_html = !composeMailForm.is_html" class="crm-btn-secondary text-xs">
                        <span x-text="composeMailForm.is_html ? 'HTML режим' : 'Текстовый режим'"></span>
                    </button>
                </label>
                
                <!-- HTML редактор -->
                <div x-show="composeMailForm.is_html"
                     x-ref="mailEditor"
                     contenteditable="true"
                     @input="composeMailForm.body = $event.target.innerHTML"
                     class="w-full px-4 py-3 crm-control-textarea min-h-[250px] outline-none prose dark:prose-invert max-w-none"
                     style="color: var(--lg-text-primary); direction: ltr; text-align: left;"
                     x-html="composeMailForm.body">
                </div>
                
                <!-- Текстовый редактор -->
                <textarea x-show="!composeMailForm.is_html"
                          x-model="composeMailForm.body"
                          rows="12"
                          class="w-full px-4 py-3 crm-control-textarea outline-none resize-none"
                          style="color: var(--lg-text-primary); direction: ltr; text-align: left;"
                          placeholder="Введите текст письма...">
                </textarea>
            </div>

            <!-- Вставка картинки -->
            <div x-show="composeMailForm.is_html" class="flex items-center gap-3 p-3 rounded-sm bg-gray-100/50 dark:bg-gray-800/50">
                <button type="button" @click="$refs.mailInlineImage.click()"
                        class="crm-btn-secondary text-sm font-medium flex items-center gap-2">
                    <svg class="w-4 h-4 crm-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    Вставить картинку
                </button>
                <input type="file" accept="image/*" x-ref="mailInlineImage" class="hidden" @change="insertInlineImage($event)" />
                <span class="text-xs crm-text-tertiary">Картинка вставится в текст письма</span>
            </div>

            <!-- Вложения -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold crm-text-secondary">Вложения</label>
                    <button type="button" @click="$refs.mailAttachments.click()"
                            class="crm-btn-secondary text-sm font-medium flex items-center gap-2">
                        <svg class="w-4 h-4 crm-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.414a4 4 0 00-5.656-5.656l-6.415 6.414a6 6 0 00-6 6 6 6 0 006 6 6 6 0 006-6 6 6 0 00-6-6 6 6 0 00-6 6z"/>
                        </svg>
                        Добавить файлы
                    </button>
                </div>
                <input type="file" multiple x-ref="mailAttachments" @change="handleMailAttachments($event)" class="hidden" />
                
                <!-- Список вложений -->
                <div x-show="(composeMailForm.attachments || []).length" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <template x-for="(f, idx) in (composeMailForm.attachments || [])" :key="idx">
                        <div class="liquid-glass-pro p-3 rounded-sm flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3 min-w-0 flex-1">
                                <div class="w-10 h-10 rounded-sm flex items-center justify-center flex-shrink-0 crm-bg-accent">
                                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                    </svg>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="text-sm font-semibold truncate crm-text-primary" x-text="f.name"></div>
                                    <div class="text-xs crm-text-tertiary" x-text="formatFileSize(f.size)"></div>
                                </div>
                            </div>
                            <button type="button" @click="removeMailAttachment(idx)" 
                                    class="p-2 rounded-lg hover:bg-red-100/50 dark:hover:bg-red-900/20 transition-colors">
                                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- SMTP опция -->
            <div class="flex items-center gap-3 p-4 rounded-sm bg-blue-50/50 dark:bg-blue-900/20 border border-blue-200/50 dark:border-blue-800/50">
                <input type="checkbox" id="useSmtp" x-model="composeMailForm.use_smtp" class="rounded text-primary focus:ring-primary/50">
                <label for="useSmtp" class="text-sm flex-1 crm-text-secondary">
                    <span class="font-semibold">Отправить через SMTP</span>
                    <span class="block text-xs crm-text-tertiary">Использовать внешний почтовый сервер вместо внутренней почты TaskFlow</span>
                </label>
            </div>
        </div>

        <!-- Футер -->
        <div class="px-6 py-4 border-t border-gray-200/50 dark:border-gray-700/50 flex items-center justify-between gap-3 bg-gray-50/50 dark:bg-gray-800/50">
            <button @click="mailComposeModalOpen = false"
                    class="crm-btn-secondary font-medium">
                Отмена
            </button>
            <div class="flex items-center gap-3">
                <button @click="saveMailDraft()"
                        :disabled="mailSending"
                        class="crm-btn-secondary font-medium">
                    Сохранить в черновики
                </button>
                <button @click="sendMail()"
                        :disabled="mailSending"
                        class="px-8 py-2.5 rounded-sm font-semibold text-white shadow-lg hover:shadow-xl transition-all flex items-center gap-2"
                        style="background: linear-gradient(135deg, var(--lg-primary) 0%, var(--lg-accent) 100%)">
                    <svg x-show="!mailSending" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                    <svg x-show="mailSending" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="mailSending ? 'Отправка...' : 'Отправить'"></span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно просмотра письма -->
<div x-show="emailViewModalOpen"
     x-transition.opacity
     class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-md"
     @click.self="emailViewModalOpen = false"
     x-cloak>

    <div class="liquid-glass-pro rounded-sm shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden flex flex-col">
        <!-- Хэдер -->
        <div class="px-6 py-4 border-b border-gray-200/50 dark:border-gray-700/50 flex items-center justify-between bg-gradient-to-r from-primary/10 to-accent/10">
            <div class="flex items-center gap-4 min-w-0 flex-1">
                <button @click="closeEmailView()" class="crm-btn-ghost crm-icon-button hover:bg-gray-200/50 dark:hover:bg-gray-700/50 transition-colors flex-shrink-0">
                    <svg class="w-5 h-5 crm-text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="min-w-0 flex-1">
                    <h3 class="text-lg font-bold truncate crm-text-primary" x-text="viewingEmail?.subject"></h3>
                    <div class="flex items-center gap-2 text-xs mt-0.5 crm-text-tertiary">
                        <span x-text="formatEmailDate(viewingEmail?.sent_at)"></span>
                        <span x-show="viewingEmail?.has_attachments">•</span>
                        <span x-show="viewingEmail?.has_attachments" class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.414a4 4 0 00-5.656-5.656l-6.415 6.414a6 6 0 00-6 6 6 6 0 006 6 6 6 0 006-6 6 6 0 00-6-6 6 6 0 00-6 6z"/>
                            </svg>
                            Вложения
                        </span>
                    </div>
                </div>
            </div>
            
            <!-- Действия -->
            <div class="flex items-center gap-2 ml-4">
                <button @click="toggleEmailStar(viewingEmail)" 
                        class="crm-btn-ghost crm-icon-button hover:bg-yellow-100/50 dark:hover:bg-yellow-900/20 transition-colors"
                        :title="Number(viewingEmail?.is_starred) ? 'Убрать из важного' : 'Важное'">
                    <svg class="w-5 h-5" 
                         :class="Number(viewingEmail?.is_starred) ? 'text-yellow-500' : ''" 
                         :style="Number(viewingEmail?.is_starred) ? '' : 'color: var(--lg-text-tertiary)'" 
                         fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </button>
                <button @click="replyToEmail()" 
                        class="crm-btn-ghost crm-icon-button hover:bg-primary/10 transition-colors"
                        title="Ответить">
                    <svg class="w-5 h-5 crm-text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                    </svg>
                </button>
                <button @click="forwardEmail()" 
                        class="crm-btn-ghost crm-icon-button hover:bg-primary/10 transition-colors"
                        title="Переслать">
                    <svg class="w-5 h-5 crm-text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
                <button @click="deleteEmail(viewingEmail?.id)" 
                        class="crm-btn-ghost crm-icon-button hover:bg-red-100/50 dark:hover:bg-red-900/20 transition-colors"
                        title="Удалить">
                    <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Контент -->
        <div class="flex-1 overflow-y-auto p-6">
            <!-- Информация об отправителе -->
            <div class="flex items-start gap-4 mb-6 pb-6 border-b border-gray-200/50 dark:border-gray-700/50">
                <div class="w-14 h-14 rounded-sm flex items-center justify-center text-white text-lg font-bold shadow-lg flex-shrink-0"
                     :style="`background: ${getAvatarGradient(viewingEmail?.sender_name || viewingEmail?.recipient_email)}`">
                    <span x-text="getInitials(viewingEmail?.sender_name || viewingEmail?.recipient_email)"></span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <h4 class="font-bold text-lg truncate crm-text-primary" x-text="viewingEmail?.sender_name || viewingEmail?.recipient_email"></h4>
                        <span class="text-xs px-2 py-1 rounded-full bg-primary/15 crm-text-accent" x-text="viewingEmail?.folder === 'sent' ? 'Вы' : 'Отправитель'"></span>
                    </div>
                    <p class="text-sm truncate crm-text-secondary" x-text="viewingEmail?.sender_email || viewingEmail?.recipient_email"></p>
                    <p class="text-xs mt-1 crm-text-tertiary">
                        Кому: <span x-text="viewingEmail?.recipient_email || viewingEmail?.contact_name"></span>
                    </p>
                </div>
            </div>

            <!-- Тело письма -->
            <div class="liquid-glass-pro rounded-sm p-5 mb-6">
                <template x-if="viewingEmail &amp;&amp; viewingEmail.is_html">
                    <div class="prose dark:prose-invert max-w-none crm-text-primary" x-html="sanitizeEmailHtml(viewingEmail.body)"></div>
                </template>
                <template x-if="viewingEmail &amp;&amp; !viewingEmail.is_html">
                    <div class="whitespace-pre-wrap leading-relaxed crm-text-primary" x-text="viewingEmail.body"></div>
                </template>
            </div>

            <!-- Вложения -->
            <div x-show="(viewingEmail?.attachments || []).length &gt; 0" class="mb-6">
                <h4 class="text-sm font-semibold mb-3 crm-text-secondary">Вложения</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    <template x-for="att in (viewingEmail?.attachments || [])" :key="att.id">
                        <a :href="getMailAttachmentDownloadUrl(att.id)" target="_blank"
                           class="liquid-glass-pro p-5 rounded-sm flex items-center gap-3 hover:shadow-lg transition-all group">
                            <div class="w-12 h-12 rounded-sm flex items-center justify-center flex-shrink-0 crm-bg-accent">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                </svg>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-semibold truncate group-hover:text-primary transition-colors crm-text-primary" x-text="att.file_name"></div>
                                <div class="text-xs crm-text-tertiary" x-text="formatFileSize(att.file_size)"></div>
                            </div>
                            <svg class="w-5 h-5 flex-shrink-0 crm-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                        </a>
                    </template>
                </div>
            </div>
        </div>

        <!-- Футер с быстрыми ответами -->
        <div class="px-6 py-4 border-t border-gray-200/50 dark:border-gray-700/50 bg-gray-50/50 dark:bg-gray-800/50">
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium crm-text-secondary">Быстрые ответы:</span>
                <button @click="quickReply('Спасибо за письмо!')" 
                        class="crm-btn-secondary text-sm">
                    Спасибо
                </button>
                <button @click="quickReply('Я свяжусь с вами в ближайшее время.')" 
                        class="crm-btn-secondary text-sm">
                    Свяжусь вскоре
                </button>
                <button @click="quickReply('Получил вашу информацию, спасибо.')" 
                        class="crm-btn-secondary text-sm">
                    Получил
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Контекстное меню письма -->
<div x-show="mailContextMenuOpen"
     x-cloak
     @click.outside="mailContextMenuOpen = false; contextMenuOpen = false;"
     :style="`position: fixed; left: ${contextMenuX}px; top: ${contextMenuY}px;`"
     class="z-[150] liquid-glass-pro rounded-sm shadow-2xl py-2 min-w-[200px]">
    
    <template x-for="item in contextMenuItems" :key="item.action">
        <button @click="executeContextMenuAction(item.action)"
                class="w-full flex items-center gap-3 px-4 py-2.5 hover:bg-gray-100/50 dark:hover:bg-gray-700/50 transition-colors">
            <svg class="w-4 h-4" :style="item.iconColor || 'color: var(--lg-text-primary)'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <template x-if="item.action === 'reply'">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                </template>
                <template x-if="item.action === 'forward'">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </template>
                <template x-if="item.action === 'star'">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </template>
                <template x-if="item.action === 'delete'">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </template>
                <template x-if="item.action === 'moveToSpam'">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </template>
                <template x-if="item.action === 'markAsRead'">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </template>
            </svg>
            <span class="text-sm font-medium crm-text-primary" x-text="item.label"></span>
        </button>
    </template>
</div>

<!-- Подтверждение очистки папки -->
<div x-show="purgeFolderModalOpen"
     x-transition.opacity
     class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
     @click.self="purgeFolderModalOpen = false"
     x-cloak>

    <div class="liquid-glass-pro rounded-sm shadow-2xl w-full max-w-md p-6">
        <div class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 rounded-sm flex items-center justify-center bg-red-500/20">
                <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <div>
                <h3 class="text-lg font-bold crm-text-primary">Очистить папку?</h3>
                <p class="text-sm crm-text-secondary">Это действие нельзя отменить</p>
            </div>
        </div>
        
        <p class="text-sm mb-6 crm-text-tertiary">
            Все письма из папки <strong x-text="purgeFolderName"></strong> будут удалены безвозвратно.
        </p>
        
        <div class="flex items-center gap-3">
            <button @click="purgeFolderModalOpen = false"
                    class="flex-1 crm-btn-secondary font-medium">
                Отмена
            </button>
            <button @click="purgeFolder()"
                    class="flex-1 px-4 py-2.5 rounded-sm font-semibold crm-btn-danger">
                Удалить всё
            </button>
        </div>
    </div>
</div>
