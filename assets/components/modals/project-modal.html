<!-- Модальное окно проекта -->
<div x-show="projectModalOpen" x-cloak x-transition.opacity class="crm-drawer-overlay z-[80]" @keydown.escape.window="closeProjectModal()">
    <div class="crm-drawer-backdrop lg-modal-backdrop" @click="closeProjectModal()"></div>
    <div class="crm-drawer-shell crm-drawer-shell-xl liquid-glass-pro lg-modal-shell"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="translate-x-full opacity-0"
         x-transition:enter-end="translate-x-0 opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="translate-x-0 opacity-100"
         x-transition:leave-end="translate-x-full opacity-0">
        <div class="crm-modal-header crm-drawer-header">
            <div class="min-w-0">
                <h2 class="crm-modal-title" x-text="editingProject ? 'Проект' : 'Новый проект'"></h2>
                <p class="crm-modal-description" x-text="editingProject?.name || 'Создание проекта и настройка параметров'"></p>
            </div>
            <button @click="closeProjectModal()" class="crm-btn-ghost crm-icon-button crm-drawer-close" aria-label="Закрыть проект">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="crm-modal-tabbar-shell crm-drawer-tabbar">
            <div class="crm-tabbar">
                <button @click="projectModalTab = 'project'" :class="projectModalTab === 'project' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">Проект</button>
                <button x-show="editingProject" @click="projectModalTab = 'tasks'" :class="projectModalTab === 'tasks' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">Задачи</button>
                <button x-show="editingProject" @click="projectModalTab = 'files'" :class="projectModalTab === 'files' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">Файлы</button>
                <button x-show="editingProject" @click="projectModalTab = 'comments'" :class="projectModalTab === 'comments' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">Комментарии</button>
                <button x-show="editingProject" @click="projectModalTab = 'history'" :class="projectModalTab === 'history' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">История</button>
            </div>
        </div>

        <div class="crm-modal-body crm-drawer-body p-6 space-y-4">
            <div x-show="projectModalTab === 'project'" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Название</label>
                        <input type="text" x-model="projectForm.name" class="w-full px-4 py-3 rounded-xl crm-control-input" placeholder="Например: Релиз 2.0" />
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Описание</label>
                        <textarea x-model="projectForm.description" rows="4" class="w-full px-4 py-3 rounded-xl crm-control-textarea" placeholder="Коротко о проекте..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Дедлайн</label>
                        <input type="date" x-model="projectForm.deadline" class="w-full px-4 py-3 rounded-xl crm-control-input" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Приоритет</label>
                        <select x-model="projectForm.priority" class="w-full px-4 py-3 rounded-xl crm-control-select">
                            <option value="low">Низкий</option>
                            <option value="medium">Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Отдел</label>
                        <select x-model="projectForm.department_ids" class="w-full px-4 py-3 rounded-xl crm-control-select">
                            <option value="">Без отдела</option>
                            <template x-for="d in (departments || [])" :key="d.id">
                                <option :value="d.id" x-text="d.name"></option>
                            </template>
                        </select>
                        <div class="text-xs mt-2" style="color: var(--lg-text-tertiary)">Сейчас используется один отдел (как раньше в API).</div>
                    </div>
                </div>
            </div>

            <div x-show="projectModalTab === 'tasks'" class="space-y-3">
                <div class="liquid-glass-pro rounded-2xl overflow-hidden">
                    <div class="p-4 font-semibold" style="color: var(--lg-text-primary)">Задачи проекта</div>
                    <div class="px-4 pb-4"><div class="crm-divider opacity-70"></div></div>
                    <div class="p-4 space-y-2">
                        <template x-for="t in (projectTasks || [])" :key="t.id">
                            <div class="liquid-glass-pro rounded-2xl p-3 flex items-center justify-between gap-4">
                                <div class="min-w-0">
                                    <div class="text-sm font-semibold truncate" style="color: var(--lg-text-primary)" x-text="t.title"></div>
                                    <div class="text-xs" style="color: var(--lg-text-secondary)" x-text="t.status || ''"></div>
                                </div>
                                <button @click="openTaskModal(t)" class="crm-btn-secondary">Открыть</button>
                            </div>
                        </template>
                        <div x-show="(projectTasks || []).length === 0" class="text-sm" style="color: var(--lg-text-secondary)">Пока нет задач.</div>
                    </div>
                </div>
            </div>

            <div x-show="projectModalTab === 'files'" class="space-y-3">
                <div class="crm-tabbar flex flex-wrap">
                    <button type="button" @click="projectFilesTab = 'all'" :class="projectFilesTab === 'all' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">Все</button>
                    <button type="button" @click="projectFilesTab = 'project'" :class="projectFilesTab === 'project' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">Файлы проекта</button>
                    <button type="button" @click="projectFilesTab = 'tasks'" :class="projectFilesTab === 'tasks' ? 'crm-tabbar-button-active' : ''" class="crm-tabbar-button">Файлы задач</button>
                    <div class="ml-auto">
                        <label class="crm-btn-primary cursor-pointer">
                            <input type="file" class="hidden" @change="uploadFileToProject($event.target.files[0])">
                            Загрузить
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <template x-for="f in getFilteredProjectFiles()" :key="f.id">
                        <div class="liquid-glass-pro p-3 rounded-2xl flex items-center justify-between gap-4">
                            <button class="text-left min-w-0" @click="previewFile(f)">
                                <div class="text-sm font-semibold truncate" style="color: var(--lg-text-primary)" x-text="f.original_name || f.filename"></div>
                                <div class="text-xs" style="color: var(--lg-text-secondary)" x-text="formatFileSize(Number(f.size || 0))"></div>
                            </button>
                            <button class="crm-btn-danger" @click="deleteProjectFile(f.id)">Удалить</button>
                        </div>
                    </template>
                    <div x-show="(getFilteredProjectFiles() || []).length === 0" class="text-sm" style="color: var(--lg-text-secondary)">Пока нет файлов.</div>
                </div>
            </div>

            <div x-show="projectModalTab === 'comments'" class="space-y-3">
                <div class="flex items-center gap-3">
                    <input type="text" x-model="newProjectComment" class="flex-1 px-4 py-3 rounded-xl crm-control-input" placeholder="Комментарий по проекту..." />
                    <button @click="addProjectComment()" class="crm-btn-primary">Отправить</button>
                </div>

                <div class="space-y-3">
                    <template x-for="c in (projectComments || []).filter(x => !x.parent_id)" :key="c.id">
                        <div class="liquid-glass-pro p-4 rounded-2xl">
                            <div class="flex items-center justify-between gap-4">
                                <div class="flex items-center gap-3 min-w-0">
                                    <img x-show="c.author_avatar && c.author_avatar !== 'null'"
                                         :src="c.author_avatar && c.author_avatar !== 'null' ? ('uploads/avatars/' + c.author_avatar) : ''"
                                         class="w-9 h-9 rounded-full object-cover border border-white/20"
                                         alt="">
                                    <div x-show="!c.author_avatar || c.author_avatar === 'null'"
                                         class="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-bold"
                                         style="background: var(--lg-primary)"
                                         x-text="getInitials(c.author_name || '')">
                                    </div>
                                    <div class="min-w-0">
                                        <div class="text-sm font-semibold truncate" style="color: var(--lg-text-primary)" x-text="c.author_name || '—'"></div>
                                        <div class="text-xs" style="color: var(--lg-text-secondary)" x-text="formatDateTime(c.created_at)"></div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button type="button" class="crm-btn-secondary text-xs" @click="projectReplyTo(c)">Ответить</button>
                                    <button @click="deleteProjectComment(c.id)" class="crm-btn-danger text-xs">Удалить</button>
                                </div>
                            </div>
                            <div class="mt-3 text-sm whitespace-pre-wrap" style="color: var(--lg-text-secondary)" x-text="c.message"></div>

                            <div class="mt-3" x-show="projectReplyId === c.id">
                                <div class="flex items-center gap-3">
                                    <input type="text" x-model="projectReplyText" class="flex-1 px-4 py-3 rounded-xl crm-control-input" placeholder="Ответ..." />
                                    <button @click="addProjectComment(c.id)" class="crm-btn-primary">Ответить</button>
                                    <button @click="projectReplyId = null; projectReplyText = ''" class="crm-btn-secondary">Отмена</button>
                                </div>
                            </div>

                            <div class="mt-3 space-y-2" x-show="(projectComments || []).some(r => String(r.parent_id) === String(c.id))">
                                <template x-for="r in (projectComments || []).filter(x => String(x.parent_id) === String(c.id))" :key="r.id">
                                    <div class="liquid-glass-pro rounded-2xl p-3 ml-4">
                                        <div class="flex items-center justify-between gap-4">
                                            <div class="text-xs font-semibold" style="color: var(--lg-text-primary)" x-text="r.author_name || '—'"></div>
                                            <div class="text-[11px]" style="color: var(--lg-text-tertiary)" x-text="formatDateTime(r.created_at)"></div>
                                        </div>
                                        <div class="mt-1 text-xs whitespace-pre-wrap" style="color: var(--lg-text-secondary)" x-text="r.message"></div>
                                        <div class="mt-2 flex justify-end">
                                            <button @click="deleteProjectComment(r.id)" class="crm-btn-danger text-[11px]">Удалить</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <div x-show="(projectComments || []).length === 0" class="text-sm" style="color: var(--lg-text-secondary)">Комментариев пока нет.</div>
                </div>
            </div>

            <div x-show="projectModalTab === 'history'" class="space-y-3">
                <div class="liquid-glass-pro rounded-2xl overflow-hidden">
                    <div class="p-4 font-semibold" style="color: var(--lg-text-primary)">История изменений</div>
                    <div class="px-4 pb-4"><div class="crm-divider opacity-70"></div></div>
                    <div class="p-4 space-y-2">
                        <template x-for="h in (projectHistory || [])" :key="h.id">
                            <div class="liquid-glass-pro rounded-2xl p-3">
                                <div class="flex items-center justify-between gap-4">
                                    <div class="text-sm font-semibold" style="color: var(--lg-text-primary)" x-text="(h.field_name ? ('Изменено: ' + h.field_name) : (h.action || 'Событие'))"></div>
                                    <div class="text-xs" style="color: var(--lg-text-secondary)" x-text="formatDateTime(h.created_at)"></div>
                                </div>
                                <div class="mt-1 text-xs" style="color: var(--lg-text-secondary)" x-text="h.user_name || ''"></div>
                                <div class="mt-2 text-xs" style="color: var(--lg-text-tertiary)" x-show="h.old_value !== null || h.new_value !== null">
                                    <span class="font-semibold">Было:</span> <span x-text="h.old_value ?? '—'"></span>
                                    <span class="mx-2">-></span>
                                    <span class="font-semibold">Стало:</span> <span x-text="h.new_value ?? '—'"></span>
                                </div>
                            </div>
                        </template>
                        <div x-show="(projectHistory || []).length === 0" class="text-sm" style="color: var(--lg-text-secondary)">История пустая.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="crm-modal-footer crm-drawer-footer">
            <button x-show="editingProject" @click="deleteProject()" class="crm-btn-secondary text-red-600 dark:text-red-400">Удалить</button>
            <div class="ml-auto flex items-center gap-3">
                <button @click="closeProjectModal()" class="crm-btn-secondary">Закрыть</button>
                <button @click="saveProject()" class="crm-btn-primary">Сохранить</button>
            </div>
        </div>
    </div>
</div>
